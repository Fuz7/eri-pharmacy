# Builds both images, pushes them to ECR tagged with the commit SHA, then runs
# deploy.sh on the production instance through SSM.
#
# Mirrors staging, differing only in: the branch (main), the ECR repository
# names, the instance tag, and the role variable (AWS_ROLE_ARN_PRODUCTION).
#
# NOTE: this deploys on every push to main with no gate. For a human in the
# loop, either drop the `push:` trigger and rely on workflow_dispatch, or add
# `environment: production` to the job and set required reviewers on that
# environment in GitHub. Declaring an environment also changes the OIDC subject
# claim to the ":environment:" form, which the trust policy in
# infra/environments/production/github_oidc.tf would then have to match.

name: production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # Required for OIDC. Without it the credentials step fails with a
      # confusing "Not authorized to perform sts:AssumeRoleWithWebIdentity".
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # The runner's default builder uses the plain `docker` driver, which
      # cannot export build cache — `cache-to: type=gha` fails with
      # "Cache export is not supported for the docker driver". This creates a
      # `docker-container` driver builder, which can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Assume the AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Images get both the full SHA and the 7-character form, so `./deploy.sh`
      # accepts whichever you copied — git log shows the short one, the job
      # summary below prints the long one.
      - name: Compute tags
        id: tags
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Two different build contexts: nginx builds from the repository root
      # because it needs both ./frontend (the source) and ./nginx (the config).
      # The backend builds from ./backend alone.
      # provenance: false keeps buildx from pushing an image index plus a
      # separate in-toto attestation alongside each image. Without it a single
      # push creates three ECR artifacts, which makes the console confusing and
      # makes the lifecycle policy's image count mean roughly a third of what it
      # looks like. Single-platform builds have no use for provenance.
      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/eri-pharmacy-production-nginx:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/eri-pharmacy-production-nginx:${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.production
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/eri-pharmacy-production-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/eri-pharmacy-production-backend:${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs deploy.sh on the instance through SSM. No SSH, so no private key
      # in GitHub and port 22 can stay closed.
      #
      # `sudo -u ec2-user` matters: SSM executes as root, and deploy.sh rewrites
      # .env every run. Left as root, that file becomes unwritable by ec2-user
      # and a later manual deploy fails with permission denied.
      - name: Deploy to production
        env:
          INSTANCE_TAG: eri-pharmacy-production-ec2
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [ -z "$instance_id" ] || [ "$instance_id" = "None" ]; then
            echo "No running instance tagged $INSTANCE_TAG" >&2
            exit 1
          fi
          echo "Instance: $instance_id"

          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ steps.tags.outputs.short_sha }}" \
            --parameters commands="sudo -u ec2-user /home/ec2-user/app/deploy.sh ${{ github.sha }}" \
            --query Command.CommandId --output text)
          echo "Command: $command_id"

          # The waiter exits non-zero when the command fails, but we want the
          # script's own output first — so swallow it and check status after.
          aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$instance_id" || true

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query Status --output text)

          echo "--- deploy.sh output ---"
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query StandardErrorContent --output text >&2

          [ "$status" = "Success" ] || { echo "Deploy finished with status: $status" >&2; exit 1; }

      - name: Summary
        run: |
          echo "### Images pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "./deploy.sh ${{ steps.tags.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "(or the full SHA ${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
