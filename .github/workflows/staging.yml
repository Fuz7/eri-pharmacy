# Builds both images and pushes them to ECR tagged with the commit SHA, then
# deploys to the production instance through SSM.
#
# Build and deploy are separate jobs so the Actions UI says which half failed
# and a flaky deploy can be re-run without rebuilding. Staging deploys on every
# push to develop with no gate, which is what staging is for — the production
# workflow is the mirror of this one and carries the notes on adding approval.

name: staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_PREFIX: eri-pharmacy-staging

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # Required for OIDC. Without it the credentials step fails with a
      # confusing "Not authorized to perform sts:AssumeRoleWithWebIdentity".
      id-token: write
      contents: read

    outputs:
      # Step outputs are job-scoped, so the deploy job cannot see this unless
      # it is republished here.
      short_sha: ${{ steps.tags.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      # The runner's default builder uses the plain `docker` driver, which
      # cannot export build cache — `cache-to: type=gha` fails with
      # "Cache export is not supported for the docker driver". This creates a
      # `docker-container` driver builder, which can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Assume the AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Images get both the full SHA and the 7-character form, so `./deploy.sh`
      # accepts whichever you copied — git log shows the short one, the job
      # summary below prints the long one.
      - name: Compute tags
        id: tags
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Two different build contexts: nginx builds from the repository root
      # because it needs both ./frontend (the source) and ./nginx (the config).
      # The backend builds from ./backend alone.
      #
      # provenance: false keeps buildx from pushing an image index plus a
      # separate in-toto attestation alongside each image. Without it a single
      # push creates three ECR artifacts, which makes the console confusing and
      # makes the lifecycle policy's image count mean roughly a third of what it
      # looks like. Single-platform builds have no use for provenance.
      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}-nginx:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}-nginx:${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.staging
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}-backend:${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo '```'
            echo "${{ env.ECR_PREFIX }}-nginx:${{ steps.tags.outputs.short_sha }}"
            echo "${{ env.ECR_PREFIX }}-backend:${{ steps.tags.outputs.short_sha }}"
            echo '```'
            echo "Roll back with \`./deploy.sh <older-sha>\` on the instance."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # To require an approval before production changes, add:
    #   environment: staging
    # and configure required reviewers on that environment in GitHub.

    permissions:
      # Credentials do not cross job boundaries — this job assumes the role
      # again for itself.
      id-token: write
      contents: read

    env:
      INSTANCE_TAG: eri-pharmacy-staging-ec2

    steps:
      # No checkout or buildx here: this job only calls the AWS CLI. The
      # instance already has deploy.sh, put there by scripts/staging/push.sh.
      - name: Assume the AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `sudo -u ec2-user` matters: SSM executes as root, and deploy.sh rewrites
      # .env every run. Left as root, that file becomes unwritable by ec2-user
      # and a later manual deploy fails with permission denied.
      - name: Run deploy.sh through SSM
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [ -z "$instance_id" ] || [ "$instance_id" = "None" ]; then
            echo "No running instance tagged $INSTANCE_TAG" >&2
            exit 1
          fi
          echo "Instance: $instance_id"

          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ needs.build.outputs.short_sha }}" \
            --parameters commands="sudo -u ec2-user /home/ec2-user/app/deploy.sh ${{ github.sha }}" \
            --query Command.CommandId --output text)
          echo "Command: $command_id"

          # The waiter exits non-zero when the command fails, but we want the
          # script's own output first — so swallow it and check status after.
          aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$instance_id" || true

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query Status --output text)

          echo "--- deploy.sh output ---"
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query StandardErrorContent --output text >&2

          [ "$status" = "Success" ] || { echo "Deploy finished with status: $status" >&2; exit 1; }

          echo "Deployed ${{ needs.build.outputs.short_sha }}" >> "$GITHUB_STEP_SUMMARY"
