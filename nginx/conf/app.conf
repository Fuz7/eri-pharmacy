# The application itself: static SPA plus a same-origin /api proxy.
# Included by both the HTTP and HTTPS server blocks so the two never drift.

root /usr/share/nginx/html;
index index.html;

client_max_body_size 2m;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Same-origin API. This is what lets the React code keep calling
# axios.get("/api/medicines") with no CORS and no absolute URLs.
location /api/ {
    set $backend backend:3000;
    proxy_pass http://$backend$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}

# Vite fingerprints these filenames, so they can be cached forever.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

# index.html must never be cached, or clients keep loading a build that
# points at asset hashes which no longer exist.
location = /index.html {
    add_header Cache-Control "no-cache";
}
