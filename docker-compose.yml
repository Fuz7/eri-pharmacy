services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: ./docker/Dockerfile
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_LOCAL_BACKEND_URL=${VITE_LOCAL_BACKEND_URL}
      - VITE_LOCAL_BACKEND_PORT=${VITE_LOCAL_BACKEND_PORT}
  backend:
    build: 
      context: ./backend
      dockerfile: ./docker/Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        # `npm run start` runs migrations first, so the database has to be
        # accepting connections before the backend container starts.
        condition: service_healthy
    env_file:
      - .env
  db:
    image: postgres:16
    ports:  
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata: