services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: ./docker/Dockerfile
    ports:
      - 5173:5173
    volumes:
    - ./frontend:/app
    depends_on:
      - backend
    environment:
      - VITE_LOCAL_BACKEND_URL=${VITE_LOCAL_BACKEND_URL}
      - VITE_LOCAL_BACKEND_PORT=${VITE_LOCAL_BACKEND_PORT}
  backend:
    build: 
      context: ./backend
      dockerfile: ./docker/Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./backend:/app
    depends_on:
      - db
    env_file:
      - .env
  db:
    image: postgres:16
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

volumes:
  pgdata: